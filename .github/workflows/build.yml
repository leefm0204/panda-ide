name: Build & Release APK

permissions:
  contents: write

concurrency:
  group: android-apk-build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove unavailable Git LFS placeholders
        # The repository's LFS budget is currently exhausted. With LFS
        # disabled, checkout leaves tiny pointer files in Android's native
        # asset directories; Gradle/llvm-strip must not treat those as .so
        # binaries. Real assets are left untouched.
        run: |
          set -euo pipefail
          removed=0
          while IFS= read -r -d '' file; do
            if [ "$(head -n 1 "$file")" = "version https://git-lfs.github.com/spec/v1" ]; then
              rm "$file"
              removed=$((removed + 1))
            fi
          done < <(find android/app/src -type f -print0)
          echo "Removed $removed unavailable Git LFS placeholder(s)."
          if [ "$removed" -gt 0 ]; then
            echo "PANDA_LFS_FALLBACK=true" >> "$GITHUB_ENV"
          else
            echo "PANDA_LFS_FALLBACK=false" >> "$GITHUB_ENV"
          fi

      - name: Verify embedded PRoot runtime binaries
        # PRoot et ses dependances ELF doivent etre de vrais binaires natifs
        # dans le checkout (hors Git LFS). Si un pointeur/placeholder passe,
        # l'APK produit echouera au runtime avec
        # "library libtalloc.so not found: needed by main executable".
        run: |
          set -euo pipefail
          dir=android/app/src/main/jniLibs/arm64-v8a
          for lib in libproot.so libtalloc.so libandroid-shmem.so libproot-loader.so libbusybox.so; do
            path="$dir/$lib"
            if [ ! -f "$path" ]; then
              echo "::error::$path manquant"; exit 1
            fi
            magic=$(head -c 4 "$path" | od -An -tx1 | tr -d ' \n')
            if [ "$magic" != "7f454c46" ]; then
              echo "::error::$path n'est pas un ELF valide (magic=$magic)"; exit 1
            fi
            echo "OK  $lib  ($(stat -c%s "$path") octets)  $(file -b "$path")"
          done
          echo "--- dependances ELF ---"
          readelf -d "$dir/libproot.so" | grep NEEDED
          echo "Rootfs downloaded at runtime (not bundled) -- skipping archive check"
      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Prepare APK release artifacts
        run: |
          mkdir -p build/out
          cp build/app/outputs/flutter-apk/*.apk build/out/panda-ide-arm64-debug.apk 2>/dev/null || cp build/app/outputs/flutter-apk/*.apk build/out/panda-ide-*.apk
          cp build/app/outputs/flutter-apk/*.apk build/out/panda-ide-universal-debug.apk 2>/dev/null || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: panda-ide-apk
          path: build/out/*.apk
          files: build/out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
